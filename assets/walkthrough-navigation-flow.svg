<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="white"/><text x="60" y="70" font-family="Arial" font-size="34" font-weight="700">3D Walkthrough Navigation Flow</text><g font-family="Arial" font-size="21" fill="#111" stroke="#111" stroke-width="2"><rect x="90" y="170" width="250" height="330" rx="24" fill="#f7f7f7"/><text x="135" y="215" stroke="none">Start Walkthrough</text><text x="125" y="270" stroke="none">On-screen controls</text><text x="130" y="315" stroke="none">Room navigation</text><rect x="475" y="170" width="250" height="330" rx="24" fill="#f7f7f7"/><text x="525" y="215" stroke="none">Explore Rooms</text><text x="515" y="270" stroke="none">Move with arrows</text><text x="510" y="315" stroke="none">Select hotspots</text><rect x="860" y="170" width="250" height="330" rx="24" fill="#f7f7f7"/><text x="915" y="215" stroke="none">Finish Tour</text><text x="905" y="270" stroke="none">Submit feedback</text><text x="905" y="315" stroke="none">Exit walkthrough</text><line x1="340" y1="335" x2="475" y2="335"/><polygon points="475,335 458,327 458,343" fill="#111"/><line x1="725" y1="335" x2="860" y2="335"/><polygon points="860,335 843,327 843,343" fill="#111"/></g><text x="90" y="610" font-family="Arial" font-size="22">The prototype concept combines spatial exploration, clickable hotspots, and a feedback step.</text></svg>